webdriver {
  driver = "edge"
  autodownload = true
  timeouts {
    implicitlywait = 0
    fluentwait = 15000
  }
  capabilities {
    browserName = "MicrosoftEdge"
    "ms:edgeOptions" {
      args = ["--window-size=1440,1000"]
    }
  }
}
headless.mode = true
serenity {
  project.name = "Sofka - Compra como invitado"
  take.screenshots = FOR_EACH_ACTION
  restart.browser.for.each = SCENARIO
  browser.maximized = false
}
